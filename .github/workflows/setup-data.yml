name: Initialize data branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream data branch
        run: |
          git remote add upstream https://github.com/nullcpy/rvb.git
          git fetch upstream data

      - name: Create data branch
        run: |
          git checkout -B data upstream/data
          git push origin data --force
