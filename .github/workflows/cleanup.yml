name: Clean Patch Configs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Clone data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch data https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git data-branch

      - name: Delete all patch configs except Instagram
        run: |
          cd data-branch

          find configs/patches -type f -name "*.toml" ! -name "instagram.toml" -print -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add configs/patches

          if git diff --cached --quiet; then
            echo "Nothing to delete."
            exit 0
          fi

          git commit -m "Keep only HushGram Instagram patch config"
          git push origin data
